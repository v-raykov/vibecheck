services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_DATABASE: vibecheck_db
      MARIADB_USER: vibecheck
      MARIADB_PASSWORD: vibecheck
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: